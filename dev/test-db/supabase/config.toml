# A Supabase of its own for the tests, on this Mac, in Docker (OrbStack,
# Colima or Docker Desktop). Started and stopped by scripts/test-db.sh, with
# Omicron's tables from ../../../supabase/migrations (the same files the
# hosted Supabase gets). Only what the tests use is switched on. Its ports
# (553xx) stay clear of other local Supabases (543xx).
project_id = "omicron-test"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[local_smtp]
enabled = false

# Comment images live here.
[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:9010"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

# Tests sign in a lot, all from this Mac.
[auth.rate_limit]
email_sent = 1000
sms_sent = 1000
anonymous_users = 1000
token_refresh = 10000
sign_in_sign_ups = 10000
token_verifications = 10000
web3 = 1000

[auth.email]
enabled = true
enable_confirmations = false

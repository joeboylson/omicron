# Where scripts/test.sh, scripts/e2e.sh and scripts/shots.sh run the tests.
# Any of these can also be set in the environment for one run, like
#   OMICRON_TEST_DB=hosted bash scripts/test.sh

# local:  a Supabase of its own on this Mac, in Docker (dev/test-db), started
#         the first time it's needed and left running. Fast, and nothing
#         touches the real database.
# hosted: Omicron's hosted Supabase (the keys in ~/.omicron/config.json),
#         over the internet. Slow; the tests clean up after themselves.
OMICRON_TEST_DB=${OMICRON_TEST_DB:-local}

# For local: the Docker to run it in, by its `docker context` name
# (orbstack, colima, desktop-linux). Empty: whichever is current.
OMICRON_TEST_DOCKER=${OMICRON_TEST_DOCKER:-orbstack}
